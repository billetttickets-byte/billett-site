<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38">
  <!-- Billett logo: the app icon from the demo video and the waitlist message (video-src/scene.html
       .app-icon with the #ticket symbol): a 38 x 38 square, 9 corner radius, Billett blue, with the
       24-unit ticket drawn at 22 x 22 in the middle. -->
  <rect width="38" height="38" rx="9" fill="#0071e3"/>
  <g transform="translate(8 8) scale(0.91666667)">
    <rect x="2" y="6" width="20" height="12" rx="2.5" fill="#fff"/>
    <circle cx="2" cy="12" r="2.6" fill="#0071e3"/>
    <circle cx="22" cy="12" r="2.6" fill="#0071e3"/>
  </g>
</svg>
